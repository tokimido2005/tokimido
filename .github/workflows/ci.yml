name: Verificare

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: rabotaem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/rabotaem
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:8080
      ADMIN_PASSWORD: CiAdminPassword123
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalare
        run: npm ci --include=dev
        env:
          NODE_ENV: development
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npx eslint src tests
      - name: Build (+ migrări pe o bază de date de test)
        run: npm run build
      - name: Pornire site
        run: |
          PORT=8080 nohup node .output/server/index.mjs > server.log 2>&1 &
      - name: Browser pentru test
        run: npx playwright install --with-deps chromium
      - name: Test paginile principale
        run: node tests/smoke.mjs
      - name: Jurnalul serverului (dacă a picat)
        if: failure()
        run: tail -n 200 server.log
